name: Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release. Untick to build and package only and keep the package as a workflow artifact.
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    name: Build package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve date-build version
        id: tag
        run: |
          # Date-build (not semver), the same scheme as MosaicShell: yyyy.M.d-b{run_number}
          name="$(date -u +%Y.%-m.%-d)-b${{ github.run_number }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Release tag: $name"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build release package
        env:
          GROUT_VERSION: ${{ steps.tag.outputs.name }}
        run: |
          npm run build
          node -e '
            const m = require("./dist/manifest.json");
            if (m.version_name !== process.env.GROUT_VERSION) {
              console.error("::error::the packaged manifest says " + m.version_name + ", not " + process.env.GROUT_VERSION);
              process.exit(1);
            }
            console.log("manifest version " + m.version + " (" + m.version_name + ")");
          '

      - name: Package zip
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: (cd dist && zip -r -X "../Grout-$TAG.zip" .)

      - name: Compute release checksums
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # A stable name beside the versioned one, so a link to the latest release never needs the version in it.
          cp "Grout-$TAG.zip" Grout.zip
          sha256sum "Grout-$TAG.zip" Grout.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Grout-${{ steps.tag.outputs.name }}
          path: |
            Grout-${{ steps.tag.outputs.name }}.zip
            Grout-${{ steps.tag.outputs.name }}-store.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          id="$(node scripts/extension-id.mjs dist/manifest.json)"

          cat > notes.md <<EOF
          ## Install
          Grout tells [MosaicShell](https://github.com/uairhahs/MosaicShell) what your browser is playing. Start MosaicShell once first: it registers Grout's connection for your account.

          1. Download **Grout-$TAG.zip** and unzip it.
          2. Open \`edge://extensions\` (or \`chrome://extensions\`), turn on Developer mode, choose **Load unpacked** and pick the unzipped folder.
          3. Reload any tab that was already playing.

          Extension ID: \`$id\`

          **Grout-$TAG-store.zip** is for uploading to the Chrome Web Store or Edge Add-ons. It is the same package without the manifest key, which a store refuses; the store gives the listing its own extension ID.

          ## Verify
          **SHA256SUMS.txt** lists the SHA-256 of every asset. To check by hand: \`sha256sum -c SHA256SUMS.txt\`.
          EOF

          gh release create "$TAG" "Grout-$TAG.zip" Grout.zip SHA256SUMS.txt \
            --title "Grout $TAG" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"
